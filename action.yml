name: Deploy Storybook PR Preview
description: >
  Uploads a PR's storybooks to the shared Flipbook preview experience via Open Cloud
  Luau Execution, then posts or updates a PR comment with the preview link.

inputs:
  mode:
    description: '"deploy" for opened/updated PRs, "prune" for closed PRs.'
    required: false
    default: deploy
  pr-number:
    description: Pull request number.
    required: true
  roblox-api-key:
    required: true
  roblox-storybook-universe-id:
    required: true
  roblox-storybook-place-id:
    required: true
  github-token:
    required: true

runs:
  using: composite
  steps:
    - uses: CompeyDev/setup-rokit@v0.1.2
      with:
        version: v1.2.0

    - name: Install rokit tools
      shell: bash
      run: cd "${{ github.action_path }}" && rokit install

    - name: Install loom dependencies
      shell: bash
      run: cd "${{ github.action_path }}" && lute pkg install

    - name: Build flipbook-cli
      shell: bash
      run: cd "${{ github.action_path }}" && lute run .lute/build.luau

    - name: Deploy PR storybook
      if: inputs.mode != 'prune'
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.roblox-api-key }}
        ROBLOX_STORYBOOK_UNIVERSE_ID: ${{ inputs.roblox-storybook-universe-id }}
        ROBLOX_STORYBOOK_PLACE_ID: ${{ inputs.roblox-storybook-place-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        FLIPBOOK_TASKS_DIR: ${{ github.action_path }}/src/tasks
      run: "${{ github.action_path }}/build/flipbook-cli deploy --pr ${{ inputs.pr-number }}"

    - name: Post storybook preview comment
      if: inputs.mode != 'prune'
      shell: bash
      env:
        ROBLOX_STORYBOOK_PLACE_ID: ${{ inputs.roblox-storybook-place-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: "${{ github.action_path }}/build/flipbook-cli comment --pr ${{ inputs.pr-number }}"

    - name: Prune PR storybook
      if: inputs.mode == 'prune'
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.roblox-api-key }}
        ROBLOX_STORYBOOK_UNIVERSE_ID: ${{ inputs.roblox-storybook-universe-id }}
        ROBLOX_STORYBOOK_PLACE_ID: ${{ inputs.roblox-storybook-place-id }}
        FLIPBOOK_TASKS_DIR: ${{ github.action_path }}/src/tasks
      run: "${{ github.action_path }}/build/flipbook-cli prune --pr ${{ inputs.pr-number }}"
