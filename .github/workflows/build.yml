name: Build

# Reusable build matrix shared by CI (on every PR) and the release workflow.
# The only difference between callers is whether the built binaries are
# packaged and uploaded as artifacts, which is controlled by `upload-artifacts`.
on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Package each binary and upload it as an artifact (used by the release workflow).
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            runner: ubuntu-latest
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            runner: windows-latest
            binary: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v7

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          version: v1.2.0

      # `lute compile` stores each bundled file under the deepest folder that
      # all of them share, and it resolves `~/` aliases in the bundle from that
      # folder. So the bundle only finds the Loom store when that folder is the
      # home folder, as it is on macOS and Linux. The Windows runner checks out
      # to D: and keeps the home folder on C:, so Lute gets a home folder that
      # contains the checkout instead. Lute reads it from `USERPROFILE` rather
      # than `HOME` on Windows. The temp folder moves to D: as well, because
      # `lute pkg install` downloads there and then moves each package into
      # the store, and that move can fail across drives.
      - name: Move Lute's home folder above the checkout
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          home="$(dirname "$(dirname "$(cygpath -m "$GITHUB_WORKSPACE")")")"
          tmp="$(cygpath -m "$RUNNER_TEMP")/tmp"
          mkdir -p "$tmp"
          {
            echo "USERPROFILE=$home"
            echo "TEMP=$tmp"
            echo "TMP=$tmp"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Smoketest
        shell: bash
        run: |
          "${{ matrix.binary || 'build/flipbook-cli' }}" --help

      # The Windows runner's Git Bash has no `zip`, so install it before packaging.
      - name: Install zip
        if: inputs.upload-artifacts && matrix.os == 'windows'
        run: choco install zip --yes --no-progress

      - name: Package binary
        if: inputs.upload-artifacts
        shell: bash
        run: zip -j "${{ matrix.zip_name }}" "${{ matrix.binary || 'build/flipbook-cli' }}"

      - name: Upload artifact
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.os }}
          path: ${{ matrix.zip_name }}
