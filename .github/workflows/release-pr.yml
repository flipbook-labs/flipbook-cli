name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect releasable changes
        id: detect
        run: |
          latest_tag="$(git tag --list "v*" --sort=-version:refname | sed -n '1p')"
          if [ -z "$latest_tag" ]; then
            commit_count="$(git rev-list --count HEAD)"
          else
            commit_count="$(git rev-list --count "${latest_tag}..HEAD")"
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if [ "$commit_count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: CompeyDev/setup-rokit@v0.2.1
        if: steps.detect.outputs.has_changes == 'true'
        with:
          version: v1.2.0

      - uses: orhun/git-cliff-action@v4
        if: steps.detect.outputs.has_changes == 'true'
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Determine next version
        if: steps.detect.outputs.has_changes == 'true'
        id: version
        run: |
          next_version="$(git cliff --bumped-version || true)"
          if [ -z "$next_version" ]; then
            current_version="$(rg 'version = "([^"]+)"' loom.config.luau -o -r '$1' -N | sed -n '1p')"
            next_version="$(echo "$current_version" | awk -F. '{ printf("%d.%d.%d", $1, $2, $3 + 1) }')"
          fi
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Sync loom.config.luau version
        if: steps.detect.outputs.has_changes == 'true'
        run: lute run sync-version "${{ steps.version.outputs.next_version }}"

      - name: Create or update release PR
        if: steps.detect.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.version.outputs.next_version }}
          title: Release v${{ steps.version.outputs.next_version }}
          commit-message: "Release v${{ steps.version.outputs.next_version }}"
          body: |
            ## Summary
            - Generate release notes with git-cliff
            - Bump `loom.config.luau` version to `${{ steps.version.outputs.next_version }}`

            ## Test plan
            - [ ] Review generated `CHANGELOG.md`
            - [ ] Merge this PR to cut the release
          add-paths: |
            CHANGELOG.md
            loom.config.luau

  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if this push should publish
        id: check
        run: |
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if echo "$changed_files" | rg -q '^CHANGELOG.md$' && echo "$changed_files" | rg -q '^loom.config.luau$'; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read release version
        if: steps.check.outputs.should_publish == 'true'
        id: version
        run: |
          version="$(rg 'version = "([^"]+)"' loom.config.luau -o -r '$1' -N | sed -n '1p')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.check.outputs.should_publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Create draft GitHub release
        if: steps.check.outputs.should_publish == 'true'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Draft release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --target "${{ github.sha }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
