name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (a draft release for this tag must already exist)
        required: true

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Build flipbook-cli
        run: lute run build

      - uses: actions/upload-artifact@v5
        with:
          name: flipbook-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}

  attach-assets:
    name: Attach binaries to draft release
    if: |
      (github.event_name == 'release' && github.event.release.draft) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip release artifacts
        run: |
          zip -rj flipbook-cli-macos-arm64.zip ./artifacts/flipbook-cli-macos-arm64/*
          zip -rj flipbook-cli-linux-x86_64.zip ./artifacts/flipbook-cli-linux-x86_64/*
          zip -rj flipbook-cli-windows-x86_64.zip ./artifacts/flipbook-cli-windows-x86_64/*

      - name: Upload assets to draft release
        run: |
          gh release upload "$RELEASE_TAG" \
            flipbook-cli-macos-arm64.zip \
            flipbook-cli-linux-x86_64.zip \
            flipbook-cli-windows-x86_64.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
