name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

# Title given to the auto-generated publish PR. Because we squash-merge, this
# becomes the subject of the publish commit on `main`, so publish-release can
# grep history for it to tag the right commit.
env:
  PUBLISH_TITLE_PREFIX: "[AUTO-GENERATED] Publish"

jobs:
  gate:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.eval.outputs.has_changes }}
      should_publish: ${{ steps.eval.outputs.should_publish }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Evaluate release action
        id: eval
        run: |
          set -euo pipefail

          version="$(grep -m1 'version = "' loom.config.luau | sed 's/.*version = "\([^"]*\)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read package version from loom.config.luau" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The version in loom.config.luau is the source of truth. If it
          # has no matching tag yet, a publish PR was just merged (the bump
          # landed but nothing has been released) so we publish it. This is
          # state-based and does not depend on the merge commit's message.
          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The current version is already released. Surface whether there
          # are commits since its tag so a new publish PR can be prepared.
          commit_count="$(git rev-list --count "v${version}..HEAD")"
          if [ "$commit_count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Locate publish commit
        id: commit
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"

          # The publish commit is the squash-merged publish PR, whose subject
          # is the PR title. Match on the subject alone (not the whole message,
          # which other commits may quote) so the tag always lands on the bump
          # commit rather than an unrelated push that tripped the gate.
          sha="$(git log --format='%H %s' | grep -F -m1 " ${PUBLISH_TITLE_PREFIX} ${tag} " | cut -d' ' -f1 || true)"
          if [ -z "$sha" ]; then
            echo "Could not find publish commit for ${tag}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create and push publish tag
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"

          if git ls-remote --exit-code origin "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists on origin"
            exit 0
          fi

          git tag "${tag}" "${{ steps.commit.outputs.sha }}"
          git push origin "${tag}"

      - name: Create draft GitHub release
        run: |
          set -euo pipefail
          tag="v${{ needs.gate.outputs.version }}"
          if gh release view "$tag"; then
            echo "Draft release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --target "${{ steps.commit.outputs.sha }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: [gate, publish-release]
    if: always()
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Windows build currently fails on a Lute-adjacent issue we still
    # need to work out. Tolerate it for now so its artifact is omitted
    # rather than blocking the release.
    continue-on-error: ${{ matrix.os == 'windows' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Attach binary to draft release
        shell: bash
        run: |
          set -euo pipefail

          zip -j "${{ matrix.zip_name }}" "${{ matrix.artifact_path }}"

          tag="v${{ needs.gate.outputs.version }}"

          is_draft="$(gh release view "$tag" --json isDraft -q '.isDraft' || echo false)"
          if [ "$is_draft" != "true" ]; then
            echo "No draft release for $tag, skipping asset upload"
            exit 0
          fi

          gh release upload "$tag" "${{ matrix.zip_name }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-release-pr:
    needs: [gate, publish-release]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (needs.gate.outputs.has_changes == 'true' && needs.gate.outputs.should_publish != 'true') ||
        (needs.gate.outputs.should_publish == 'true' && needs.publish-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          if git rev-parse "v${version}"; then
            IFS=. read -r major minor patch <<< "$version"
            next_version="$major.$((minor + 1)).0"
          else
            next_version="$version"
          fi
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Bump package version
        run: lute run bump-version --version "${{ steps.version.outputs.next_version }}"

      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.next_version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update publish PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: publish-next-version
          title: "${{ env.PUBLISH_TITLE_PREFIX }} v${{ steps.version.outputs.next_version }}"
          commit-message: "Publish v${{ steps.version.outputs.next_version }}"
          body: |
            This PR prepares the next release by bumping the version and updating the changelog.

            Merging this PR will:

            1. Create and push tag `v${{ steps.version.outputs.next_version }}`
            2. Create a draft GitHub release for that tag
            3. Trigger binary builds for macOS, Linux, and Windows
            4. Attach release assets to the draft release

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.next_version }}

            🤖 This PR was generated by [this action run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: |
            CHANGELOG.md
            loom.config.luau
