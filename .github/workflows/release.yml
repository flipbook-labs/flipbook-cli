name: Release

# The release lifecycle lives in the `flipbook-cli release` subcommands (gate,
# draft, attach, publish, prepare-pr). This workflow builds the binary once and
# then runs those subcommands against the built artifact, exercising the real
# binary the way a user would rather than running the source through Lute.

on:
  push:
    branches: [main]
  # Debugging escape hatch: label a PR `debug:release-pr` to build the binary and
  # open a *throwaway* debug PR (see `prepare-release-pr`) that previews the
  # regenerated changelog / version bump before this PR lands. The `labeled` type
  # makes adding the label re-trigger. Without the label every job below skips, so
  # a normal PR never spins up the release build matrix (PR validation is already
  # covered by ci.yml). The side-effecting jobs are additionally guarded with
  # `github.event_name != 'pull_request'`, so even a labeled PR can never tag,
  # draft, attach, or publish a real release.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.os }})
    # On PRs, only build when the debug label is present; see the `on:` comment.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Windows build currently fails on a Lute-adjacent issue we still
    # need to work out. Tolerate it for now so its artifact is omitted
    # rather than blocking the release.
    continue-on-error: ${{ matrix.os == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            runner: ubuntu-latest
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            runner: windows-latest
            binary: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Package binary
        shell: bash
        run: zip -j "${{ matrix.zip_name }}" "${{ matrix.binary || 'build/flipbook-cli' }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.os }}
          path: ${{ matrix.zip_name }}

      # The Linux binary is reused by the jobs below to run the release
      # subcommands, so upload it unzipped for them to download.
      - name: Upload runnable CLI
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: flipbook-cli
          path: build/flipbook-cli

  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.eval.outputs.has_changes }}
      should_publish: ${{ steps.eval.outputs.should_publish }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Evaluate release action
        id: eval
        run: |
          set -euo pipefail
          chmod +x flipbook-cli
          result="$(./flipbook-cli release gate ${{ inputs.force_publish && '--force-publish' || '' }})"
          echo "$result"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: [build, gate]
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Tag and draft release
        run: |
          chmod +x flipbook-cli
          ./flipbook-cli release draft --version "${{ needs.gate.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach:
    needs: [build, gate, publish-release]
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Checkout so `gh` can infer the repository from the origin remote.
      - uses: actions/checkout@v6

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - name: Attach assets to draft release
        run: |
          chmod +x flipbook-cli
          ./flipbook-cli release attach --tag "v${{ needs.gate.outputs.version }}" --files assets/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Take the release live only after its binaries are attached, so consumers
  # never see a published release with missing downloads. Publishing fires the
  # `release: published` event for any downstream automation.
  publish:
    needs: [build, gate, attach]
    if: github.event_name != 'pull_request' && needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Checkout so `gh` can infer the repository from the origin remote.
      - uses: actions/checkout@v6

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Publish release
        run: |
          chmod +x flipbook-cli
          ./flipbook-cli release publish --tag "v${{ needs.gate.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-release-pr:
    needs: [build, gate, publish-release]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (
          github.event_name != 'pull_request' &&
          (
            (needs.gate.outputs.has_changes == 'true' && needs.gate.outputs.should_publish != 'true') ||
            (needs.gate.outputs.should_publish == 'true' && needs.publish-release.result == 'success')
          )
        ) ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.FLIPBOOK_BACKEND_APP_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # On a debug PR run, check out the PR's own branch so the regeneration
          # runs against this PR's content (the debug PR then previews the publish
          # PR as it would look once this PR merges).
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      # `release prepare-pr` shells out to git-cliff to regenerate the changelog,
      # which Rokit provides.
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Prepare release changes
        id: prepare
        run: |
          set -euo pipefail
          chmod +x flipbook-cli
          result="$(./flipbook-cli release prepare-pr)"
          echo "$result"
          # `release prepare-pr` shells out to git-cliff, whose command echo lands
          # on stdout ahead of the JSON result; keep only the final JSON line.
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$(tail -n1 <<< "$result")" >> "$GITHUB_OUTPUT"

      # Preview the release this PR will produce, rendered by the same command
      # that will populate the real release notes (`release notes` shares its
      # renderer with `release draft`), so the preview can't drift. The tag does
      # not exist yet here, so it renders the not-yet-released commits.
      - name: Render release notes preview
        id: notes
        run: |
          set -euo pipefail
          {
            echo 'body<<__RELEASE_NOTES_EOF__'
            ./flipbook-cli release notes --version "${{ steps.prepare.outputs.version }}"
            echo '__RELEASE_NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update publish PR
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          # Push as the GitHub App rather than the default GITHUB_TOKEN so the
          # branch push triggers CI on the publish PR. Pushes made with
          # GITHUB_TOKEN do not trigger further workflow runs.
          # Read more: https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.ref_name }}
          branch: publish-next-version
          draft: true
          commit-message: Publish v${{ steps.prepare.outputs.version }}
          title: "[AUTO-GENERATED] Publish v${{ steps.prepare.outputs.version }}"
          add-paths: |
            CHANGELOG.md
            loom.config.luau
          body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `v${{ steps.prepare.outputs.version }}`
            > 2. Create a draft GitHub release for that tag
            > 3. Trigger binary builds for macOS, Linux, and Windows
            > 4. Attach the build artifacts to the release
            > 5. Publish the release once the artifacts are attached

            ## Release preview

            Once merged and published, the GitHub release will look like this:

            **Title:** v${{ steps.prepare.outputs.version }} &nbsp;·&nbsp; **Tag:** `v${{ steps.prepare.outputs.version }}`

            ${{ steps.notes.outputs.body }}

            ---

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.prepare.outputs.version }}

            🤖 This PR was generated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      # Debug escape hatch: opens a throwaway PR off the labeled PR's own branch
      # instead of touching `publish-next-version`.
      - name: Open throwaway debug publish PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: debug-publish-pr-${{ github.event.pull_request.number }}
          draft: true
          commit-message: Publish v${{ steps.prepare.outputs.version }}
          title: "[DEBUG — DO NOT MERGE] Regenerated publish PR for #${{ github.event.pull_request.number }}"
          add-paths: |
            CHANGELOG.md
            loom.config.luau
          # Mirror the real publish PR body exactly so this debug PR previews how
          # the publish PR will render, with a short do-not-merge warning on top.
          body: |
            >[!WARNING]
            > **Debug artifact — do not merge.** Built from the branch of #${{ github.event.pull_request.number }} and pushed to `debug-publish-pr-${{ github.event.pull_request.number }}`, so it can't touch the real `publish-next-version` PR. Close it when you're done.

            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `v${{ steps.prepare.outputs.version }}`
            > 2. Create a draft GitHub release for that tag
            > 3. Trigger binary builds for macOS, Linux, and Windows
            > 4. Attach the build artifacts to the release
            > 5. Publish the release once the artifacts are attached

            ## Release preview

            Once merged and published, the GitHub release will look like this:

            **Title:** v${{ steps.prepare.outputs.version }} &nbsp;·&nbsp; **Tag:** `v${{ steps.prepare.outputs.version }}`

            ${{ steps.notes.outputs.body }}

            ---

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.prepare.outputs.version }}

            🤖 This PR was generated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
