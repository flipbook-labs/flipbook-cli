name: Release

# Release decision logic lives in the `flipbook-cli release` subcommands
# (gate, publish, attach, prepare-pr). This workflow invokes those and owns the
# per-OS build matrix, which is the part that has to run on CI runners.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

jobs:
  gate:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.eval.outputs.has_changes }}
      should_publish: ${{ steps.eval.outputs.should_publish }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Evaluate release action
        id: eval
        run: |
          set -euo pipefail
          result="$(lute cli.luau release gate ${{ inputs.force_publish && '--force-publish' || '' }})"
          echo "$result"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Tag and draft release
        run: lute cli.luau release publish --version "${{ needs.gate.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: [gate, publish-release]
    if: always()
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Windows build currently fails on a Lute-adjacent issue we still
    # need to work out. Tolerate it for now so its artifact is omitted
    # rather than blocking the release.
    continue-on-error: ${{ matrix.os == 'windows' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Package binary
        shell: bash
        run: zip -j "${{ matrix.zip_name }}" "${{ matrix.artifact_path }}"

      - name: Attach binary to draft release
        if: needs.gate.outputs.should_publish == 'true'
        run: lute cli.luau release attach --tag "v${{ needs.gate.outputs.version }}" --files "${{ matrix.zip_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-release-pr:
    needs: [gate, publish-release]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (needs.gate.outputs.has_changes == 'true' && needs.gate.outputs.should_publish != 'true') ||
        (needs.gate.outputs.should_publish == 'true' && needs.publish-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Author the PR as the GitHub App rather than the default GITHUB_TOKEN so
      # that the resulting branch push triggers CI on the publish PR (pushes
      # made with GITHUB_TOKEN do not trigger further workflow runs).
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FLIPBOOK_BACKEND_APP_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Prepare publish PR
        run: lute cli.luau release prepare-pr --base "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
