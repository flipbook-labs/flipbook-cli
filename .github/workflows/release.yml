name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

jobs:
  # Publishing is driven by the publish PR merging, not by a push to `main`.
  # The publish PR always comes from the `publish-next-version` branch (a name
  # we own), and GitHub hands us the exact merge commit, so we tag that commit
  # directly instead of searching history for it.
  publish:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'publish-next-version') ||
      (github.event_name == 'workflow_dispatch' && inputs.force_publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      published: ${{ steps.tag.outputs.published }}
    steps:
      - name: Resolve publish commit
        id: resolve
        run: |
          set -euo pipefail
          # On a merged publish PR GitHub gives us the exact merge commit; a
          # forced publish tags the current tip of `main`.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.merge_commit_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Read package version
        id: meta
        run: |
          set -euo pipefail
          version="$(grep -m1 'version = "' loom.config.luau | sed 's/.*version = "\([^"]*\)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read package version from loom.config.luau" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push publish tag
        id: tag
        run: |
          set -euo pipefail
          tag="v${{ steps.meta.outputs.version }}"

          if git ls-remote --exit-code origin "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists on origin"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD is the resolved publish commit, so this tags it directly.
          git tag "${tag}"
          git push origin "${tag}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        if: steps.tag.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag="v${{ steps.meta.outputs.version }}"
          if gh release view "$tag"; then
            echo "Draft release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --target "${{ steps.resolve.outputs.sha }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.os }})
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Windows build currently fails on a Lute-adjacent issue we still
    # need to work out. Tolerate it for now so its artifact is omitted
    # rather than blocking the release.
    continue-on-error: ${{ matrix.os == 'windows' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.sha }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Attach binary to draft release
        shell: bash
        run: |
          set -euo pipefail

          zip -j "${{ matrix.zip_name }}" "${{ matrix.artifact_path }}"

          tag="v${{ needs.publish.outputs.version }}"

          is_draft="$(gh release view "$tag" --json isDraft -q '.isDraft' || echo false)"
          if [ "$is_draft" != "true" ]; then
            echo "No draft release for $tag, skipping asset upload"
            exit 0
          fi

          gh release upload "$tag" "${{ matrix.zip_name }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep a `publish-next-version` PR open whenever `main` has commits worth
  # releasing. Merging that PR is what triggers the publish job above.
  prepare-release-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Plan next release
        id: plan
        run: |
          set -euo pipefail
          version="$(grep -m1 'version = "' loom.config.luau | sed 's/.*version = "\([^"]*\)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not read package version from loom.config.luau" >&2
            exit 1
          fi

          latest_tag="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"

          if [ -z "$latest_tag" ]; then
            # Nothing has ever been released; prepare the current version as the
            # first release.
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "next_version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            # `main` is at a version with no tag yet: a publish PR just merged
            # and the publish job is still tagging it. Let it settle — the next
            # push re-evaluates once the tag exists.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The current version is released. Prepare the next minor only if
          # commits have landed since its tag.
          if [ "$(git rev-list --count "v${version}..HEAD")" -eq 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$version"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "next_version=$major.$((minor + 1)).0" >> "$GITHUB_OUTPUT"

      - uses: CompeyDev/setup-rokit@v0.2.1
        if: steps.plan.outputs.proceed == 'true'
        with:
          version: v1.2.0

      - name: Install dependencies
        if: steps.plan.outputs.proceed == 'true'
        run: lute run install

      - name: Bump package version
        if: steps.plan.outputs.proceed == 'true'
        run: lute run bump-version --version "${{ steps.plan.outputs.next_version }}"

      - uses: orhun/git-cliff-action@v4
        if: steps.plan.outputs.proceed == 'true'
        with:
          config: cliff.toml
          args: --tag v${{ steps.plan.outputs.next_version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update publish PR
        if: steps.plan.outputs.proceed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: publish-next-version
          title: "[AUTO-GENERATED] Publish v${{ steps.plan.outputs.next_version }}"
          commit-message: "Publish v${{ steps.plan.outputs.next_version }}"
          body: |
            This PR prepares the next release by bumping the version and updating the changelog.

            Merging this PR will:

            1. Create and push tag `v${{ steps.plan.outputs.next_version }}`
            2. Create a draft GitHub release for that tag
            3. Trigger binary builds for macOS, Linux, and Windows
            4. Attach release assets to the draft release

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.plan.outputs.next_version }}

            🤖 This PR was generated by [this action run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: |
            CHANGELOG.md
            loom.config.luau
