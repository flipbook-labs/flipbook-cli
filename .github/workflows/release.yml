name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Build flipbook-cli
        run: lute run build

      - uses: actions/upload-artifact@v5
        with:
          name: flipbook-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip release artifacts
        run: |
          zip -rj flipbook-cli-macos-arm64.zip ./artifacts/flipbook-cli-macos-arm64/*
          zip -rj flipbook-cli-linux-x86_64.zip ./artifacts/flipbook-cli-linux-x86_64/*
          zip -rj flipbook-cli-windows-x86_64.zip ./artifacts/flipbook-cli-windows-x86_64/*

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: flipbook-cli-macos-arm64.zip
          asset_name: flipbook-cli-macos-arm64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: flipbook-cli-linux-x86_64.zip
          asset_name: flipbook-cli-linux-x86_64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: flipbook-cli-windows-x86_64.zip
          asset_name: flipbook-cli-windows-x86_64.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
