name: Release

# The release lifecycle lives in the `flipbook-cli release` subcommands (gate,
# publish, attach, prepare-pr). This workflow builds the binary once and then
# runs those subcommands against the built artifact, exercising the real binary
# the way a user would rather than running the source through Lute.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Tag and create draft release from version on `main`
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # The Windows build currently fails on a Lute-adjacent issue we still
    # need to work out. Tolerate it for now so its artifact is omitted
    # rather than blocking the release.
    continue-on-error: ${{ matrix.os == 'windows' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            zip_name: flipbook-cli-macos-arm64.zip
          - os: linux
            runner: ubuntu-latest
            zip_name: flipbook-cli-linux-x86_64.zip
          - os: windows
            runner: windows-latest
            binary: build/flipbook-cli.exe
            zip_name: flipbook-cli-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - name: Package binary
        shell: bash
        run: zip -j "${{ matrix.zip_name }}" "${{ matrix.binary || 'build/flipbook-cli' }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.os }}
          path: ${{ matrix.zip_name }}

      # The Linux binary is reused by the jobs below to run the release
      # subcommands, so upload it unzipped for them to download.
      - name: Upload runnable CLI
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: flipbook-cli
          path: build/flipbook-cli

  gate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.eval.outputs.has_changes }}
      should_publish: ${{ steps.eval.outputs.should_publish }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Evaluate release action
        id: eval
        run: |
          set -euo pipefail
          chmod +x flipbook-cli
          result="$(./flipbook-cli release gate ${{ inputs.force_publish && '--force-publish' || '' }})"
          echo "$result"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: [build, gate]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Tag and draft release
        run: |
          chmod +x flipbook-cli
          ./flipbook-cli release draft --version "${{ needs.gate.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach:
    needs: [build, gate, publish-release]
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Checkout so `gh` can infer the repository from the origin remote.
      - uses: actions/checkout@v6

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - name: Attach assets to draft release
        run: |
          chmod +x flipbook-cli
          ./flipbook-cli release attach --tag "v${{ needs.gate.outputs.version }}" --files assets/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare-release-pr:
    needs: [build, gate, publish-release]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      (
        (needs.gate.outputs.has_changes == 'true' && needs.gate.outputs.should_publish != 'true') ||
        (needs.gate.outputs.should_publish == 'true' && needs.publish-release.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FLIPBOOK_BACKEND_APP_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # `release prepare-pr` shells out to git-cliff to regenerate the changelog,
      # which Rokit provides.
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Download flipbook-cli
        uses: actions/download-artifact@v8
        with:
          name: flipbook-cli

      # `release prepare-pr` bumps the version and regenerates the changelog,
      # leaving both staged in the working tree, and prints the next version as
      # JSON. peter-evans/create-pull-request below commits those changes and
      # owns the PR itself.
      - name: Prepare release changes
        id: prepare
        run: |
          set -euo pipefail
          chmod +x flipbook-cli
          result="$(./flipbook-cli release prepare-pr)"
          echo "$result"
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"

      - name: Create or update publish PR
        uses: peter-evans/create-pull-request@v7
        with:
          # Push as the GitHub App rather than the default GITHUB_TOKEN so the
          # branch push triggers CI on the publish PR (pushes made with
          # GITHUB_TOKEN do not trigger further workflow runs).
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.ref_name }}
          branch: publish-next-version
          commit-message: Publish v${{ steps.prepare.outputs.version }}
          title: "[AUTO-GENERATED] Publish v${{ steps.prepare.outputs.version }}"
          add-paths: |
            CHANGELOG.md
            loom.config.luau
          body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `v${{ steps.prepare.outputs.version }}`
            > 2. Create a draft GitHub release for that tag
            > 3. Trigger binary builds for macOS, Linux, and Windows
            > 4. Attach release assets to the draft release

            Next release will be available here:
            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.prepare.outputs.version }}

            🤖 This PR was generated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
