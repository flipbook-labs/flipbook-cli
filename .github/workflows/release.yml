name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  # Draft releases do not trigger `release` created/edited workflows (GitHub Actions docs).
  # After saving a draft in the UI, push the tag or run this workflow manually.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to attach binaries to (e.g. v0.1.0)
        required: true

jobs:
  build:
    name: build - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_type == 'tag' && github.ref_name || github.sha }}

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Build flipbook-cli
        run: lute run build

      - uses: actions/upload-artifact@v5
        with:
          name: flipbook-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}

  attach-assets:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip release artifacts
        run: |
          zip -rj flipbook-cli-macos-arm64.zip ./artifacts/flipbook-cli-macos-arm64/*
          zip -rj flipbook-cli-linux-x86_64.zip ./artifacts/flipbook-cli-linux-x86_64/*
          zip -rj flipbook-cli-windows-x86_64.zip ./artifacts/flipbook-cli-windows-x86_64/*

      - name: Upload assets to draft release
        run: |
          gh release upload "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" \
            flipbook-cli-macos-arm64.zip \
            flipbook-cli-linux-x86_64.zip \
            flipbook-cli-windows-x86_64.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
