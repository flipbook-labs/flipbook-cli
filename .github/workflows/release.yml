name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  detect-changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes since latest release tag
        id: detect
        run: |
          latest_tag="$(git tag --list "v*" --sort=-version:refname | sed -n '1p')"
          if [ -z "$latest_tag" ]; then
            commit_count="$(git rev-list --count HEAD)"
          else
            commit_count="$(git rev-list --count "${latest_tag}..HEAD")"
          fi

          if [ "$commit_count" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  prepare-release-pr:
    needs: detect-changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      next_version: ${{ steps.version.outputs.next_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --unreleased
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Determine next version
        id: version
        run: |
          next_version="$(git cliff --bumped-version 2>/dev/null || true)"
          next_version="${next_version#v}"
          if [ -z "$next_version" ]; then
            current_version="$(rg 'version = "([^"]+)"' loom.config.luau -o -r '$1' -N | sed -n '1p')"
            next_version="$(echo "$current_version" | awk -F. '{ printf("%d.%d.%d", $1, $2, $3 + 1) }')"
          fi
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Bump package version
        run: lute run bump-version --version "${{ steps.version.outputs.next_version }}"

      - name: Create or update publish PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.version.outputs.next_version }}
          title: "[bot] Publish v${{ steps.version.outputs.next_version }}"
          commit-message: "Publish v${{ steps.version.outputs.next_version }}"
          body: |
            This PR is generated by release automation.

            Merging it will:
            - create and push tag `v${{ steps.version.outputs.next_version }}`
            - create a draft GitHub release for that tag
            - trigger binary builds for macOS, Linux, and Windows
            - attach release zip assets to that draft release
          add-paths: |
            CHANGELOG.md
            loom.config.luau

  check-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect publish release
        id: detect
        run: |
          changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if echo "$changed_files" | rg -q '^CHANGELOG.md$' && echo "$changed_files" | rg -q '^loom.config.luau$'; then
            version="$(rg 'version = "([^"]+)"' loom.config.luau -o -r '$1' -N | sed -n '1p')"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  publish-release:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and push publish tag
        run: |
          tag="v${{ needs.check-publish.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"

      - name: Create draft GitHub release
        run: |
          tag="v${{ needs.check-publish.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Draft release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --target "${{ github.sha }}" \
            --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
            artifact_path: build/flipbook-cli
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_path: build/flipbook-cli
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_path: build/flipbook-cli.exe
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install dependencies
        run: lute run install

      - name: Build flipbook-cli
        run: lute run build

      - uses: actions/upload-artifact@v5
        with:
          name: flipbook-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}

  attach-assets:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Zip release artifacts
        run: |
          zip -rj flipbook-cli-macos-arm64.zip ./artifacts/flipbook-cli-macos-arm64/*
          zip -rj flipbook-cli-linux-x86_64.zip ./artifacts/flipbook-cli-linux-x86_64/*
          zip -rj flipbook-cli-windows-x86_64.zip ./artifacts/flipbook-cli-windows-x86_64/*

      - name: Upload assets to draft release
        run: |
          gh release upload "${{ github.ref_name }}" \
            flipbook-cli-macos-arm64.zip \
            flipbook-cli-linux-x86_64.zip \
            flipbook-cli-windows-x86_64.zip \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
