name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install rokit tools
        run: rokit install

      - name: Install loom dependencies
        run: lute pkg install

      - name: Build flipbook-cli
        run: lute run build

      - name: Verify binary
        run: ./build/flipbook-cli --help || true

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0

      - name: Install rokit tools
        run: rokit install

      - name: Install loom dependencies
        run: lute pkg install

      - name: Analyze
        run: lute run analyze
